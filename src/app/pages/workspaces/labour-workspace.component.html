<app-domain-workspace-shell
  title="Operations and Passbook Hub"
  subtitle="Attendance, wages, client entries, production, firm and partner passbooks in one place"
  icon="groups">

  <mat-tab-group animationDuration="200ms" dynamicHeight>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>event_note</mat-icon>
        Quick Daily Entry
      </ng-template>
      <ng-template matTabContent>
        <app-daily-entry [embedded]="true"></app-daily-entry>
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>payments</mat-icon>
        All Passbooks
      </ng-template>
      <ng-template matTabContent>
        <app-reports-dashboard [embedded]="true" [labourOnly]="false"></app-reports-dashboard>
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>badge</mat-icon>
        Labour Master
      </ng-template>
      <ng-template matTabContent>
        <app-labour-ledger [embedded]="true"></app-labour-ledger>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</app-domain-workspace-shell>
